[package]
name = "glbscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/M1chlCZ/glbscope"
homepage = "https://github.com/M1chlCZ/glbscope"
description = "Fast GLB inspector and asset budget linter for CI."
readme = "README.md"
keywords = ["gltf", "glb", "3d", "cli", "performance"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
